  /api/auth/senha/redefinir/:
    post:
      operationId: auth_senha_redefinir
      description: Troca a senha usando o `uid` e o `token` do link. A nova senha
        segue as regras do cadastro. Link inválido, adulterado, expirado ou já usado
        (ou de conta suspensa) → `400` com a mesma mensagem. Se a senha for fraca,
        o `400` não gasta o link. No sucesso, **todas as sessões abertas do usuário
        são encerradas** (os refresh tokens vão para a lista de bloqueio) e o contador
        de tentativas de login do e-mail é zerado; é preciso entrar de novo com a
        nova senha.
      summary: Redefinir a senha com o link do e-mail
      tags:
