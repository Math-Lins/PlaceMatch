  /api/auth/login/:
    post:
      operationId: auth_login
      description: 'Autentica por e-mail e senha (e-mail sem diferenciar maiúsculas)
        e devolve os tokens JWT. Envie o `access` no cabeçalho `Authorization: Bearer
        <access>` das demais chamadas. Contas suspensas recebem 401 com a mensagem
        "Conta suspensa. Procure o suporte.". **Limite de tentativas:** só as tentativas
        que falham contam. Passando de 5 por minuto (mesmo IP) ou de 10 por hora (mesmo
        e-mail, sem diferenciar maiúsculas, exista a conta ou não), a resposta é `429`
        com o cabeçalho `Retry-After`. As taxas são configuráveis (`LOGIN_LIMITE_IP`,
        `LOGIN_LIMITE_EMAIL`). Login correto zera o contador do e-mail.'
      summary: Entrar (login por e-mail)
      tags:
      - Autenticação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequisicaoRequest'
            examples:
              Login:
                value:
                  email: Ana.Souza@exemplo.com
                  password: <SENHA>
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequisicaoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequisicaoRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensResposta'
              examples:
                ExemploReal:
                  value:
                    refresh: <REFRESH>
                    access: <TOKEN>
                  summary: Exemplo real
          description: Tokens de acesso e de renovação.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                E-mailESenhaAusentes:
                  value:
                    email:
                    - Informe o e-mail.
                    password:
                    - Informe a senha.
                  summary: E-mail e senha ausentes
          description: Dados inválidos (mensagem em português, por campo ou em `detail`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDetalhe'
              examples:
                SenhaIncorretaOuUsuárioInexistente:
                  value:
                    detail: E-mail ou senha incorretos.
                  summary: Senha incorreta ou usuário inexistente
                ContaSuspensa:
                  value:
                    detail: Conta suspensa. Procure o suporte.
                  summary: Conta suspensa
          description: 'Não autenticado: token ausente, inválido ou expirado (ou credenciais
            inválidas no login).'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDetalhe'
              examples:
                TentativasDemais(com`Retry-After`):
                  value:
                    detail: Muitas tentativas. Aguarde alguns minutos e tente de novo.
                  summary: Tentativas demais (com `Retry-After`)
          description: 'Tentativas de login demais: aguarde o tempo do cabeçalho `Retry-After`
            (em segundos).'
      x-quem-pode: Público (sem login)
