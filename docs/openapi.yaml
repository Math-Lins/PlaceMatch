openapi: 3.0.3
info:
  title: API do PlaceMatch
  version: 1.0.0-rc2
  description: |-
    API REST do PlaceMatch: plataforma que conecta pessoas compatíveis para dividir moradia.

    **Autenticação:** faça `POST /api/auth/login/` e envie o `access` no cabeçalho `Authorization: Bearer <access>` (botão **Authorize**). O access dura 1 hora; renove com `POST /api/auth/login/refresh/`.

    **Erros:** sempre em português — `{"detail": "mensagem"}` ou `{"campo": ["mensagem"]}`.

    Os exemplos são respostas reais da API em um banco de teste (listas longas abreviadas).
paths:
  /api/admin/dashboard/:
    get:
      operationId: painel_dashboard
      description: 'KPIs, séries diárias (matches, curtidas e mensagens), top regiões
        e distribuição de score. Período padrão: últimos 30 dias (aplicado às séries;
        os KPIs de curtidas e matches são acumulados). `taxa_match` = curtidas positivas
        que fazem parte de um match ÷ curtidas positivas × 100, sempre entre 0 e 100;
        as duas contagens usam o mesmo conjunto de curtidas (filtro de região/tipo
        aplicado ao perfil de origem da curtida).'
      summary: Dashboard
      parameters:
      - in: query
        name: data_fim
        schema:
          type: string
          format: date
        description: Fim do período. Formato `AAAA-MM-DD`. Formato inválido, `data_inicio`
          maior que `data_fim`, data anterior a 2000-01-01 ou período maior que 366
          dias → 400.
        examples:
          Exemplo:
            value: '2026-11-30'
      - in: query
        name: data_inicio
        schema:
          type: string
          format: date
        description: Início do período. Formato `AAAA-MM-DD`. Formato inválido, `data_inicio`
          maior que `data_fim`, data anterior a 2000-01-01 ou período maior que 366
          dias → 400.
        examples:
          Exemplo:
            value: '2026-11-01'
      - in: query
        name: regiao
        schema:
          type: string
        description: Filtra pelos perfis desta região.
        examples:
          Exemplo:
            value: Boa Viagem
      - in: query
        name: tipo
        schema:
          type: string
          enum:
          - administrador
          - buscando_vaga
          - oferecendo_vaga
        description: Filtra pelo tipo de usuário.
      tags:
      - Painel administrativo
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
              examples:
                ExemploReal:
                  value:
                    kpis:
                      usuarios_total: 6
                      usuarios_por_tipo:
                        oferecendo_vaga: 2
                        buscando_vaga: 3
                        administrador: 1
                      usuarios_suspensos: 0
                      perfis_total: 3
                      curtidas_total: 2
                      recusas_total: 1
                      matches_total: 1
                      taxa_match: 100.0
                      mensagens_total: 2
                      conversas_ativas: 1
                      score_medio: 0.9295
                      denuncias_pendentes: 0
                    series:
                      matches_por_dia:
                      - data: '2026-10-20'
                        total: 0
                      - data: '2026-10-21'
                        total: 0
                      - data: '2026-10-22'
                        total: 0
                      curtidas_por_dia:
                      - data: '2026-10-20'
                        total: 0
                      - data: '2026-10-21'
                        total: 0
                      - data: '2026-10-22'
                        total: 0
                      mensagens_por_dia:
                      - data: '2026-10-20'
                        total: 0
                      - data: '2026-10-21'
                        total: 0
                      - data: '2026-10-22'
                        total: 0
                    top_regioes:
                    - regiao: Boa Viagem
                      perfis: 2
                      matches: 1
                      score_medio: 0.9295
                    - regiao: Casa Forte
                      perfis: 1
                      matches: 0
                      score_medio: null
                    distribuicao_score:
                    - faixa: 0-20
                      total: 0
                    - faixa: 20-40
                      total: 0
                    - faixa: 40-60
                      total: 0
                    filtros_aplicados: {}
                  summary: Exemplo real
                ComFiltros:
                  value:
                    kpis:
                      usuarios_total: 6
                      usuarios_por_tipo:
                        oferecendo_vaga: 2
                      usuarios_suspensos: 0
                      perfis_total: 1
                      curtidas_total: 1
                      recusas_total: 0
                      matches_total: 1
                      taxa_match: 100.0
                      mensagens_total: 2
                      conversas_ativas: 1
                      score_medio: 0.9295
                      denuncias_pendentes: 0
                    series:
                      matches_por_dia:
                      - data: '2026-10-20'
                        total: 0
                      - data: '2026-10-21'
                        total: 0
                      - data: '2026-10-22'
                        total: 0
                      curtidas_por_dia:
                      - data: '2026-10-20'
                        total: 0
                      - data: '2026-10-21'
                        total: 0
                      - data: '2026-10-22'
                        total: 0
                      mensagens_por_dia:
                      - data: '2026-10-20'
                        total: 0
                      - data: '2026-10-21'
                        total: 0
                      - data: '2026-10-22'
                        total: 0
                    top_regioes:
                    - regiao: Boa Viagem
                      perfis: 2
                      matches: 1
                      score_medio: 0.9295
                    - regiao: Casa Forte
                      perfis: 1
                      matches: 0
                      score_medio: null
                    distribuicao_score:
                    - faixa: 0-20
                      total: 0
                    - faixa: 20-40
                      total: 0
                    - faixa: 40-60
                      total: 0
                    filtros_aplicados:
                      regiao: Boa Viagem
                      tipo: oferecendo_vaga
                  summary: Com filtros
          description: Indicadores.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDetalhe'
              examples:
                PeríodoInvertido:
                  value:
                    detail: data_inicio não pode ser maior que data_fim.
                  summary: Período invertido
                PeríodoMaiorQue366Dias:
                  value:
                    detail: O período não pode passar de 366 dias. Reduza o intervalo
                      entre as datas.
                  summary: Período maior que 366 dias
          description: Dados inválidos (mensagem em português, por campo ou em `detail`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDetalhe'
              examples:
                SemToken:
                  value:
                    detail: As credenciais de autenticação não foram fornecidas.
                  summary: Sem token
                TokenInválidoOuExpirado:
                  value:
                    detail: O token informado não é válido para qualquer tipo de token
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: O token é inválido
                  summary: Token inválido ou expirado
          description: 'Não autenticado: token ausente, inválido ou expirado (ou credenciais
            inválidas no login).'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDetalhe'
              examples:
                UsuárioComum:
                  value:
                    detail: Você não tem permissão para executar essa ação.
                  summary: Usuário comum
          description: Sem permissão para este recurso.
      x-quem-pode: Somente administrador
  /api/admin/logs/:
    get:
      operationId: logs_listar
      description: Histórico de operações, do mais recente para o mais antigo. O texto
        das mensagens e as senhas nunca são gravados; o log de falha de login guarda
        só o motivo (`credenciais` ou `conta_inativa`).
      summary: Listar logs de operações
      parameters:
      - in: query
        name: acao
        schema:
          type: string
          enum:
          - CADASTRO
          - CURTIDA
          - DENUNCIA_CRIADA
          - DENUNCIA_RESOLVIDA
          - LOGIN
          - LOGIN_FALHA
          - MATCH_CRIADO
          - MENSAGEM_ENVIADA
          - PERFIL_CRIADO
          - PERFIL_EDITADO
          - PERFIL_EXCLUIDO
          - RECUSA
          - RELATORIO_EXPORTADO
          - SENHA_REDEFINIDA
          - SENHA_SOLICITADA
          - USUARIO_REATIVADO
          - USUARIO_SUSPENSO
        description: Ação registrada.
      - in: query
        name: data_fim
        schema:
          type: string
          format: date
        description: Até esta data. Formato `AAAA-MM-DD`. Formato inválido, `data_inicio`
          maior que `data_fim`, data anterior a 2000-01-01 ou período maior que 366
          dias → 400.
        examples:
          Exemplo:
            value: '2026-11-30'
      - in: query
        name: data_inicio
        schema:
          type: string
          format: date
        description: A partir desta data. Formato `AAAA-MM-DD`. Formato inválido,
          `data_inicio` maior que `data_fim`, data anterior a 2000-01-01 ou período
          maior que 366 dias → 400.
        examples:
          Exemplo:
            value: '2026-11-01'
      - in: query
        name: entidade
        schema:
          type: string
        description: Tipo de objeto afetado (`usuario`, `perfil`, `match`...).
        examples:
          Exemplo:
            value: perfil
      - in: query
        name: page
        schema:
          type: integer
        description: 'Página (padrão 1). Valor inválido volta à página 1; página além
          do fim devolve `results: []`.'
        examples:
          Exemplo:
            value: 1
      - in: query
        name: page_size
        schema:
          type: integer
        description: Itens por página (padrão 20, máximo 100).
        examples:
          Exemplo:
            value: 20
      - in: query
        name: q
        schema:
          type: string
        description: Busca em e-mail, nome, username ou entidade.
        examples:
          Exemplo:
            value: ana
      - in: query
        name: usuario
        schema:
          type: string
        description: Id, e-mail ou parte do nome do usuário.
        examples:
          Exemplo:
            value: ana.souza@exemplo.com
      tags:
      - Logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsPagina'
              examples:
                ExemploReal:
                  value:
                    count: 1
                    page: 1
                    results:
                    - id: 26
                      data_hora: '2026-11-18T12:36:15.187486Z'
                      usuario:
                        id: 3
                        nome: Bruno Lima
                        email: bruno.lima@exemplo.com
                      acao: MATCH_CRIADO
                      acao_label: Match criado
                      entidade: match
                      entidade_id: 1
                      detalhes:
                        score: 0.9295
                        match_id: 1
                      ip: 127.0.0.1
                  summary: Exemplo real
                FiltradoPorE-mailDoUsuário:
                  value:
                    count: 10
                    page: 1
                    results:
                    - id: 29
                      data_hora: '2026-11-18T12:36:16.701747Z'
                      usuario:
                        id: 2
                        nome: Ana Souza
                        email: ana.souza@exemplo.com
                      acao: DENUNCIA_CRIADA
                      acao_label: Denúncia criada
                      entidade: denuncia
                      entidade_id: 1
                      detalhes:
                        motivo: spam
                        denunciado_id: 4
                      ip: 127.0.0.1
                  summary: Filtrado por e-mail do usuário
          description: Página de logs.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDetalhe'
              examples:
                AçãoInválida:
                  value:
                    detail: 'Ação inválida. Use: LOGIN, LOGIN_FALHA, CADASTRO, PERFIL_CRIADO,
                      PERFIL_EDITADO, PERFIL_EXCLUIDO, CURTIDA, RECUSA, MATCH_CRIADO,
                      MENSAGEM_ENVIADA, RELATORIO_EXPORTADO, DENUNCIA_CRIADA, DENUNCIA_RESOLVIDA,
                      USUARIO_SUSPENSO, USUARIO_REATIVADO, SENHA_SOLICITADA, SENHA_REDEFINIDA.'
                  summary: Ação inválida
          description: Dados inválidos (mensagem em português, por campo ou em `detail`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDetalhe'
              examples:
                SemToken:
                  value:
                    detail: As credenciais de autenticação não foram fornecidas.
                  summary: Sem token
                TokenInválidoOuExpirado:
                  value:
                    detail: O token informado não é válido para qualquer tipo de token
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: O token é inválido
                  summary: Token inválido ou expirado
          description: 'Não autenticado: token ausente, inválido ou expirado (ou credenciais
            inválidas no login).'
      x-quem-pode: Somente administrador
  /api/admin/logs/exportar/:
    get:
      operationId: logs_exportar
      description: Mesmos filtros da listagem (sem paginação). CSV com BOM e separador
        `;`. Registra o log `RELATORIO_EXPORTADO`.
      summary: Exportar logs (CSV)
      parameters:
      - in: query
        name: acao
        schema:
          type: string
          enum:
          - CADASTRO
          - CURTIDA
          - DENUNCIA_CRIADA
          - DENUNCIA_RESOLVIDA
          - LOGIN
          - LOGIN_FALHA
          - MATCH_CRIADO
          - MENSAGEM_ENVIADA
          - PERFIL_CRIADO
          - PERFIL_EDITADO
          - PERFIL_EXCLUIDO
          - RECUSA
          - RELATORIO_EXPORTADO
          - SENHA_REDEFINIDA
          - SENHA_SOLICITADA
          - USUARIO_REATIVADO
          - USUARIO_SUSPENSO
        description: Ação registrada.
      - in: query
        name: data_fim
        schema:
          type: string
          format: date
        description: Até esta data. Formato `AAAA-MM-DD`. Formato inválido, `data_inicio`
          maior que `data_fim`, data anterior a 2000-01-01 ou período maior que 366
          dias → 400.
        examples:
          Exemplo:
            value: '2026-11-30'
      - in: query
        name: data_inicio
        schema:
          type: string
          format: date
        description: A partir desta data. Formato `AAAA-MM-DD`. Formato inválido,
          `data_inicio` maior que `data_fim`, data anterior a 2000-01-01 ou período
          maior que 366 dias → 400.
        examples:
          Exemplo:
            value: '2026-11-01'
      - in: query
        name: entidade
        schema:
          type: string
        description: Tipo de objeto afetado.
        examples:
          Exemplo:
            value: perfil
      - in: query
        name: q
        schema:
          type: string
        description: Busca em e-mail, nome, username ou entidade.
        examples:
          Exemplo:
            value: ana
      - in: query
        name: usuario
        schema:
          type: string
        description: Id, e-mail ou parte do nome do usuário.
        examples:
          Exemplo:
            value: ana.souza@exemplo.com
      tags:
      - Logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
              examples:
                ExemploReal(primeirasLinhas):
                  value: "\uFEFFID;Data/Hora;Usuário ID;Usuário Nome;Usuário E-mail;Ação;Descrição
                    da Ação;Entidade;ID da Entidade;Detalhes;IP\n14;18/11/2026 09:36:07;2;Ana
                    Souza;ana.souza@exemplo.com;LOGIN;Login;usuario;2;;127.0.0.1\n13;18/11/2026
                    09:36:05;1;e2e-admin@teste.com;e2e-admin@teste.com;LOGIN;Login;usuario;1;;127.0.0.1\n12;18/11/2026
                    09:36:03;5;Diego Alves;diego.alves@exemplo.com;LOGIN;Login;usuario;5;;127.0.0.1"
                  summary: Exemplo real (primeiras linhas)
          description: Arquivo CSV de logs.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDetalhe'
              examples:
                AçãoInválida:
                  value:
                    detail: 'Ação inválida. Use: LOGIN, LOGIN_FALHA, CADASTRO, PERFIL_CRIADO,
                      PERFIL_EDITADO, PERFIL_EXCLUIDO, CURTIDA, RECUSA, MATCH_CRIADO,
                      MENSAGEM_ENVIADA, RELATORIO_EXPORTADO, DENUNCIA_CRIADA, DENUNCIA_RESOLVIDA,
                      USUARIO_SUSPENSO, USUARIO_REATIVADO, SENHA_SOLICITADA, SENHA_REDEFINIDA.'
                  summary: Ação inválida
          description: Dados inválidos (mensagem em português, por campo ou em `detail`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDetalhe'
              examples:
                SemToken:
                  value:
                    detail: As credenciais de autenticação não foram fornecidas.
                  summary: Sem token
                TokenInválidoOuExpirado:
                  value:
                    detail: O token informado não é válido para qualquer tipo de token
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: O token é inválido
                  summary: Token inválido ou expirado
          description: 'Não autenticado: token ausente, inválido ou expirado (ou credenciais
            inválidas no login).'
      x-quem-pode: Somente administrador
  /api/admin/moderacao/denuncias/:
    get:
      operationId: moderacao_denuncias_listar
      description: Denúncias da mais recente para a mais antiga. Valores inválidos
        nos filtros → 400.
      summary: Listar denúncias
      parameters:
      - in: query
        name: data_fim
        schema:
          type: string
          format: date
        description: Criadas até esta data (inclusive). Formato `AAAA-MM-DD`. Formato
          inválido, `data_inicio` maior que `data_fim`, data anterior a 2000-01-01
          ou período maior que 366 dias → 400.
        examples:
          Exemplo:
            value: '2026-11-30'
      - in: query
        name: data_inicio
        schema:
          type: string
          format: date
        description: Criadas a partir desta data (inclusive). Formato `AAAA-MM-DD`.
          Formato inválido, `data_inicio` maior que `data_fim`, data anterior a 2000-01-01
          ou período maior que 366 dias → 400.
        examples:
          Exemplo:
            value: '2026-11-01'
      - in: query
        name: denunciado
        schema:
          type: integer
        description: Id do usuário denunciado.
        examples:
          Exemplo:
            value: 4
      - in: query
        name: motivo
        schema:
          type: string
          enum:
          - falso
          - ofensivo
          - outro
          - spam
        description: Motivo.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - descartada
          - pendente
          - resolvida
        description: Situação.
      tags:
      - Moderação
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DenunciaAdmin'
              examples:
                ExemploReal:
                  value:
                  - - id: 1
                      denunciante:
                        id: 2
                        email: ana.souza@exemplo.com
                      denunciado:
                        id: 4
                        email: carla.dias@exemplo.com
                      motivo: spam
                      motivo_display: Spam
                      descricao: Anúncio repetido várias vezes.
                      status: pendente
                      resolvida_por: null
                      resolucao: ''
                      criada_em: '2026-11-18T12:36:16.697460Z'
                      atualizada_em: '2026-11-18T12:36:16.697481Z'
                  summary: Exemplo real
          description: Denúncias.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDetalhe'
              examples:
                FiltroInválido:
                  value:
                    detail: 'Status inválido. Use: pendente, resolvida, descartada.'
                  summary: Filtro inválido
          description: Dados inválidos (mensagem em português, por campo ou em `detail`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDetalhe'
              examples:
                SemToken:
                  value:
                    detail: As credenciais de autenticação não foram fornecidas.
                  summary: Sem token
                TokenInválidoOuExpirado:
                  value:
                    detail: O token informado não é válido para qualquer tipo de token
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: O token é inválido
                  summary: Token inválido ou expirado
          description: 'Não autenticado: token ausente, inválido ou expirado (ou credenciais
            inválidas no login).'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDetalhe'
              examples:
                UsuárioComum:
                  value:
                    detail: Você não tem permissão para executar essa ação.
                  summary: Usuário comum
          description: Sem permissão para este recurso.
      x-quem-pode: Somente administrador
  /api/admin/moderacao/denuncias/{denuncia_id}/:
    patch:
      operationId: moderacao_denuncia_resolver
      description: Só denúncias `pendente` podem ser decididas. `resolucao` é opcional
        (até 500 caracteres). Para suspender o usuário, use a rota de suspensão.
      summary: Resolver ou descartar uma denúncia
      parameters:
      - in: path
        name: denuncia_id
        schema:
          type: integer
        required: true
      tags:
      - Moderação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedResolverDenunciaRequisicaoRequest'
            examples:
              Procedente:
                value:
                  status: resolvida
                  resolucao: Anúncio duplicado; conta suspensa.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedResolverDenunciaRequisicaoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedResolverDenunciaRequisicaoRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolverDenunciaResposta'
              examples:
                ExemploReal:
                  value:
                    id: 1
                    status: resolvida
                    resolucao: Anúncio duplicado; conta suspensa.
                    resolvida_por: e2e-admin@teste.com
                  summary: Exemplo real
          description: Denúncia decidida.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDetalhe'
              examples:
                DenúnciaJáDecidida:
                  value:
                    detail: Apenas denúncias pendentes podem ser resolvidas.
                  summary: Denúncia já decidida
          description: Dados inválidos (mensagem em português, por campo ou em `detail`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDetalhe'
              examples:
                SemToken:
                  value:
                    detail: As credenciais de autenticação não foram fornecidas.
                  summary: Sem token
                TokenInválidoOuExpirado:
                  value:
                    detail: O token informado não é válido para qualquer tipo de token
                    code: token_not_valid
                    messages:
                    - token_class: AccessToken
                      token_type: access
                      message: O token é inválido
                  summary: Token inválido ou expirado
          description: 'Não autenticado: token ausente, inválido ou expirado (ou credenciais
            inválidas no login).'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDetalhe'
              examples:
                UsuárioComum:
