  /api/auth/senha/solicitar/:
    post:
      operationId: auth_senha_solicitar
      description: 'Envia por e-mail um link para criar uma nova senha. A resposta
        é **sempre** `200` com a mesma mensagem, exista a conta ou não, esteja ela
        ativa ou suspensa e mesmo quando o limite de pedidos foi passado (assim a
        rota não revela quais e-mails têm conta). O e-mail só é enviado para **conta
        ativa** (o administrador ativo também pode recuperar a senha; conta suspensa
        não recebe). **Limites** (por pedido, exista a conta ou não): 3 por e-mail
        a cada 15 minutos e 10 por IP por hora; acima disso a resposta continua `200`,
        sem enviar (`SENHA_LIMITE_EMAIL` e `SENHA_LIMITE_IP`). O link é `{FRONTEND_URL}/?screen=redefinir-senha&uid=...&token=...`,
        vale por 1 hora e deixa de valer quando a senha muda. Em desenvolvimento o
        e-mail aparece no console do servidor.'
      summary: Pedir o link de redefinição de senha
      tags:
      - Autenticação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SenhaSolicitarRequisicaoRequest'
            examples:
              PedidoDeLink:
                value:
