                  token: <TOKEN_DO_LINK>
                  nova_senha: <SENHA>
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SenhaRedefinirRequisicaoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SenhaRedefinirRequisicaoRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroDetalhe'
              examples:
                ExemploReal:
                  value:
                    detail: Senha redefinida. Entre com a nova senha.
                  summary: Exemplo real
          description: Senha redefinida.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                LinkInválido,ExpiradoOuJáUsado:
                  value:
                    detail: Link inválido ou expirado. Peça um novo link.
                  summary: Link inválido, expirado ou já usado
                SenhaFraca:
                  value:
                    nova_senha:
                    - A senha deve ter no mínimo 8 caracteres.
                  summary: Senha fraca
                CamposAusentes:
                  value:
                    uid:
                    - Informe o uid do link.
                    token:
                    - Informe o token do link.
                    nova_senha:
                    - Informe a nova senha.
                  summary: Campos ausentes
          description: Dados inválidos (mensagem em português, por campo ou em `detail`).
