components:
  schemas:
    AceitaVisitasEnum:
      enum:
      - raramente
      - as_vezes
      - frequentemente
      type: string
      description: |-
        * `raramente` - Raramente
        * `as_vezes` - Às vezes
        * `frequentemente` - Frequentemente
    ContaResposta:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        ativo:
          type: boolean
          description: false = conta suspensa.
      required:
      - ativo
      - email
      - id
    Conversa:
      type: object
      properties:
        match_id:
          type: integer
        outro_perfil:
          $ref: '#/components/schemas/ConversaOutroPerfil'
        score:
          type: number
          format: double
          description: De 0 a 1.
        ultima_mensagem:
          allOf:
          - $ref: '#/components/schemas/ConversaUltimaMensagem'
          nullable: true
        nao_lidas:
          type: integer
          description: Mensagens do outro participante ainda não lidas.
      required:
      - match_id
      - nao_lidas
      - outro_perfil
      - score
      - ultima_mensagem
    ConversaOutroPerfil:
      type: object
      properties:
        id:
          type: integer
        usuario_id:
          type: integer
        nome:
          type: string
        idade:
          type: integer
        regiao:
          type: string
        tipo:
          type: string
          description: Tipo do usuário do outro perfil.
        titulo_anuncio:
          type: string
        descricao_imovel:
          type: string
        fotos_imovel:
          type: array
          items:
            type: string
        foto_perfil_url:
          type: string
        tipo_imovel:
          type: string
        qtd_moradores:
          type: integer
        orcamento_min:
          type: string
          description: Decimal em texto.
        orcamento_max:
          type: string
          description: Decimal em texto.
        aceita_pets:
          type: boolean
        fumante:
          type: boolean
      required:
      - aceita_pets
      - descricao_imovel
      - foto_perfil_url
      - fotos_imovel
      - fumante
      - id
      - idade
      - nome
      - orcamento_max
      - orcamento_min
      - qtd_moradores
      - regiao
      - tipo
      - tipo_imovel
      - titulo_anuncio
      - usuario_id
    ConversaUltimaMensagem:
      type: object
      properties:
        conteudo:
          type: string
        data_envio:
          type: string
          format: date-time
        remetente_id:
          type: integer
          description: Id do PERFIL remetente.
      required:
      - conteudo
      - data_envio
      - remetente_id
    CurtidaRequisicaoRequest:
      type: object
      properties:
        perfil_destino:
          type: integer
          description: Id do PERFIL (não do usuário) a avaliar.
        tipo:
          allOf:
          - $ref: '#/components/schemas/CurtidaRequisicaoTipoEnum'
          description: |-
            Ação.

            * `curtir` - curtir
            * `recusar` - recusar
      required:
      - perfil_destino
      - tipo
    CurtidaRequisicaoTipoEnum:
      enum:
      - curtir
      - recusar
      type: string
      description: |-
        * `curtir` - curtir
        * `recusar` - recusar
    CurtidaResposta:
      type: object
      properties:
        match:
          type: boolean
          description: true quando a outra pessoa já tinha curtido (match criado).
        match_data:
          allOf:
          - $ref: '#/components/schemas/Match'
          description: Presente só quando `match` é true.
      required:
      - match
    Dashboard:
      type: object
      properties:
        kpis:
          $ref: '#/components/schemas/DashboardKpis'
        series:
          $ref: '#/components/schemas/DashboardSeries'
        top_regioes:
          type: array
          items:
            $ref: '#/components/schemas/TopRegiao'
        distribuicao_score:
          type: array
          items:
            $ref: '#/components/schemas/FaixaScore'
        filtros_aplicados:
          type: object
          additionalProperties:
            type: string
            nullable: true
      required:
      - distribuicao_score
      - filtros_aplicados
      - kpis
      - series
      - top_regioes
    DashboardKpis:
      type: object
      properties:
        usuarios_total:
          type: integer
        usuarios_por_tipo:
          type: object
          additionalProperties:
            type: integer
        usuarios_suspensos:
          type: integer
        perfis_total:
          type: integer
        curtidas_total:
          type: integer
        recusas_total:
          type: integer
        matches_total:
          type: integer
        taxa_match:
          type: number
          format: double
          description: 'Em %, de 0 a 100: curtidas positivas que fazem parte de um
            match ÷ curtidas positivas × 100. As duas contagens usam o mesmo conjunto
            de curtidas de `curtidas_total` (mesmo filtro de região/tipo, aplicado
            ao perfil de origem da curtida). Sem curtidas: 0.'
        mensagens_total:
          type: integer
        conversas_ativas:
          type: integer
        score_medio:
          type: number
          format: double
          nullable: true
          description: De 0 a 1.
        denuncias_pendentes:
          type: integer
      required:
      - conversas_ativas
      - curtidas_total
      - denuncias_pendentes
      - matches_total
      - mensagens_total
      - perfis_total
      - recusas_total
      - score_medio
      - taxa_match
      - usuarios_por_tipo
      - usuarios_suspensos
      - usuarios_total
    DashboardSeries:
      type: object
      properties:
        matches_por_dia:
          type: array
          items:
            $ref: '#/components/schemas/PontoSerie'
        curtidas_por_dia:
          type: array
          items:
            $ref: '#/components/schemas/PontoSerie'
        mensagens_por_dia:
          type: array
          items:
            $ref: '#/components/schemas/PontoSerie'
      required:
      - curtidas_por_dia
      - matches_por_dia
      - mensagens_por_dia
    DenunciaAdmin:
      type: object
      properties:
        id:
          type: integer
        denunciante:
          $ref: '#/components/schemas/PessoaResumo'
        denunciado:
          $ref: '#/components/schemas/PessoaResumo'
        motivo:
          type: string
        motivo_display:
          type: string
        descricao:
          type: string
        status:
          $ref: '#/components/schemas/DenunciaAdminStatusEnum'
        resolvida_por:
          type: string
          nullable: true
          description: E-mail do administrador que decidiu.
        resolucao:
          type: string
        criada_em:
          type: string
          format: date-time
        atualizada_em:
          type: string
          format: date-time
      required:
      - atualizada_em
      - criada_em
      - denunciado
      - denunciante
      - descricao
      - id
      - motivo
      - motivo_display
      - resolucao
      - resolvida_por
      - status
    DenunciaAdminStatusEnum:
      enum:
      - pendente
      - resolvida
      - descartada
      type: string
      description: |-
        * `pendente` - pendente
        * `resolvida` - resolvida
        * `descartada` - descartada
    DenunciaCriada:
      type: object
      properties:
        id:
          type: integer
        denunciado:
          type: integer
        motivo:
          type: string
        status:
          type: string
          description: Sempre `pendente` ao criar.
        criada_em:
          type: string
          format: date-time
      required:
      - criada_em
      - denunciado
      - id
      - motivo
      - status
    DenunciaRequisicaoRequest:
      type: object
      properties:
        denunciado:
          type: integer
          description: Id do USUÁRIO denunciado (não do perfil).
        motivo:
          $ref: '#/components/schemas/MotivoEnum'
        descricao:
          type: string
          minLength: 1
          description: Detalhes (até 500 caracteres).
          maxLength: 500
      required:
      - denunciado
      - motivo
    ErroDetalhe:
      type: object
      properties:
        detail:
          type: string
          description: Mensagem de erro em português.
      required:
      - detail
    FaixaScore:
      type: object
      properties:
        faixa:
          type: string
          description: 'Ex.: "0-20".'
        total:
          type: integer
      required:
      - faixa
      - total
    LogItem:
      type: object
      properties:
        id:
          type: integer
        data_hora:
          type: string
          format: date-time
        usuario:
          allOf:
          - $ref: '#/components/schemas/LogUsuario'
          nullable: true
        acao:
          type: string
        acao_label:
          type: string
        entidade:
          type: string
        entidade_id:
          type: integer
          nullable: true
        detalhes:
          type: object
          additionalProperties: {}
        ip:
          type: string
          nullable: true
      required:
      - acao
      - acao_label
