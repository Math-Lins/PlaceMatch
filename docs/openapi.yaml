  /api/auth/registrar/:
    post:
      operationId: auth_registrar
      description: Cria uma conta de usuário comum. O campo `username` recebe o **nome
        da pessoa** (2 a 150 caracteres; aceita espaços e acentos). O e-mail é gravado
        em minúsculas e é único sem diferenciar maiúsculas. A senha segue os validadores
        do Django (mínimo 8 caracteres, não só números, não muito comum). `administrador`
        não pode ser escolhido aqui (use `python manage.py criar_admin`). Depois do
        cadastro, faça o login e crie o perfil.
      summary: Cadastrar usuário
      tags:
      - Autenticação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarRequest'
            examples:
              CadastroDeQuemProcuraVaga:
                value:
                  username: Ana Souza
                  email: ana.souza@exemplo.com
                  password: <SENHA>
                  tipo: buscando_vaga
                summary: Cadastro de quem procura vaga
              CadastroDeQuemOfereceVaga:
                value:
                  username: Bruno Lima
                  email: bruno.lima@exemplo.com
                  password: <SENHA>
                  tipo: oferecendo_vaga
                summary: Cadastro de quem oferece vaga
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistrarRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistrarRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registrar'
              examples:
                ExemploReal:
                  value:
                    username: Ana Souza
                    email: ana.souza@exemplo.com
                    tipo: buscando_vaga
                  summary: Exemplo real
          description: Usuário criado (a senha nunca é devolvida).
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                E-mailJáCadastrado(semDiferenciarMaiúsculas):
                  value:
                    email:
                    - Este e-mail já está cadastrado.
                  summary: E-mail já cadastrado (sem diferenciar maiúsculas)
                VáriosCamposInválidos:
                  value:
                    username:
                    - O nome deve ter pelo menos 2 caracteres.
                    email:
                    - Informe um e-mail válido.
                    password:
                    - A senha deve ter no mínimo 8 caracteres.
                    tipo:
                    - Tipo de conta inválido. Use "buscando_vaga" ou "oferecendo_vaga".
                  summary: Vários campos inválidos
