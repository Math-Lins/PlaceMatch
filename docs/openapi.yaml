tags:
- name: Autenticação
  description: Cadastro, login por e-mail, renovação do token e usuário logado.
- name: Perfis
  description: Perfil de matching e anúncio do imóvel (um perfil por usuário).
- name: Descoberta e Matches
  description: Perfis compatíveis, curtidas (curtir/recusar) e matches.
- name: Chat
  description: Conversas e mensagens entre as duas pessoas de um match.
- name: Moderação
  description: Denúncias de usuários, análise pelo administrador e suspensão de contas.
- name: Painel administrativo
  description: Dashboard, relatórios, lista de usuários e exportações CSV (somente
    administrador).
- name: Logs
  description: Histórico de operações do sistema (somente administrador).
