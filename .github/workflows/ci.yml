name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py check --settings=placematch.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=placematch.test_settings
      - run: python manage.py test --settings=placematch.test_settings --noinput

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pm_e2e
          POSTGRES_USER: pm_e2e
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pm_e2e -d pm_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_ADMIN_EMAIL: admin@ci.test
      E2E_ADMIN_SENHA: CI-only-admin-12345!
      E2E_DB_PASSWORD: ci-only-disposable-password
      E2E_DB_PORT: '5432'
      # Evita download do modelo real; integração com ele continua separada.
      IA_HABILITADA: 'True'
      IA_EMBEDDER: falso
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # N15 exige semântica do modelo real, não do embedder falso.
      - run: npm run e2e -- --grep-invert "N15 ThoLuk"
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-falhas
          path: frontend/e2e/resultados/
          retention-days: 7
