# Banco descartável SÓ para os testes e2e (porta 5433). Não toca no banco de desenvolvimento.
# Subir:  docker compose -f e2e/docker-compose.e2e.yml --env-file e2e/.env.e2e up -d
# Apagar: docker compose -f e2e/docker-compose.e2e.yml --env-file e2e/.env.e2e down -v
services:
  db-e2e:
    image: postgres:16
    container_name: placematch_e2e_db
    environment:
      POSTGRES_DB: ${E2E_DB_NAME}
      POSTGRES_USER: ${E2E_DB_USER}
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD}
    ports:
      - "${E2E_DB_PORT}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${E2E_DB_USER} -d ${E2E_DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 15
